<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobHeavy-Lowsalary</title>
</head>
<body>
<script>
(async () => {
  const REPO = "/JobHeavy-Lowsalary";
  const LAN = "http://ne1-debt";
  const CLOUDFLARE = "https://divine-bonus-81c5.jakkarinsangsuwan.workers.dev";

  const path = location.pathname.startsWith(REPO)
    ? location.pathname.slice(REPO.length)
    : location.pathname;

  const targetPath = path || "/";
  const query = location.search || "";
  const hash = location.hash || "";

  let base = "";

  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 2000);

    const res = await fetch(LAN + "/health", {
      method: "GET",
      mode: "cors",
      cache: "no-store",
      targetAddressSpace: "local",
      signal: controller.signal
    });

    clearTimeout(timer);

    if (res.ok) {
      base = LAN;
    }
  } catch (e) {
    console.log("LAN ใช้ไม่ได้:", e);
  }

  if (!base) {
    try {
      const res = await fetch(CLOUDFLARE + "/", {
        method: "GET",
        cache: "no-store"
      });

      if (res.ok) {
        base = (await res.text()).trim();
      }
    } catch (e) {
      console.log("Cloudflare ใช้ไม่ได้:", e);
    }
  }

  if (!base) {
    document.body.innerText = "ไม่สามารถเชื่อมต่อ LAN หรือ ngrok ได้";
    return;
  }

  const target =
    base.replace(/\/+$/, "") +
    "/" +
    targetPath.replace(/^\/+/, "") +
    query +
    hash;

  location.replace(target);
})();
</script>
</body>
</html>
